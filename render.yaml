databases:
  - name: casino-royal-core-db
    plan: free
    databaseName: casino_db
    user: casino

services:
  - type: web
    name: casino-royal-core
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn casino_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: casino-royal-core-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
