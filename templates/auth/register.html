<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Royal Casino Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Tahoma, sans-serif;
            background: radial-gradient(circle at 20% 0%, #2B028C 0%, transparent 45%),
                        radial-gradient(circle at 100% 30%, #F44CFC 0%, transparent 35%),
                        #0E000E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .screen { width: 100%; max-width: 420px; padding: 24px 18px; }
        .card { background: rgba(20, 5, 40, 0.55); border: 1px solid #46407C; border-radius: 24px; padding: 24px 20px; }

        .header { text-align: center; margin-bottom: 18px; }
        .logo { font-size: 2.4rem; }
        .title {
            font-size: 1.5rem; font-weight: 800; font-style: italic;
            background: linear-gradient(90deg, #FFD36E, #F44CFC);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: 0.8rem; color: #cfcbe8; margin-top: 4px; }

        .form-row { display: flex; gap: 10px; }
        .form-group { position: relative; margin-bottom: 12px; flex: 1; }
        label { display: block; font-size: 0.72rem; color: #cfcbe8; margin-bottom: 6px; font-weight: 600; }
        input, select {
            width: 100%; padding: 11px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid #46407C;
            border-radius: 10px;
            color: #fff; font-size: 0.85rem;
        }
        input::placeholder { color: #9c96c4; }
        input:focus, select:focus { outline: none; border-color: #F44CFC; }
        select option { background: #1a0a2e; }

        .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 0.72rem; color: #cfcbe8; }
        .checkbox-row input { width: auto; }
        .checkbox-row a { color: #F44CFC; }

        .btn-submit {
            width: 100%; padding: 13px;
            border: 1px solid #B5FEFA; border-radius: 12px;
            background: conic-gradient(from 55deg, #01F9BE, #02F789, #00A8D4, #01F9BE);
            color: #052015; font-weight: 800; font-size: 1rem;
            cursor: pointer; margin: 10px 0 14px;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .link-row { text-align: center; font-size: 0.82rem; color: #cfcbe8; }
        .link-row a { color: #F44CFC; text-decoration: none; font-weight: 600; }

        .error-message {
            background: rgba(244, 76, 252, 0.12); border: 1px solid #F44CFC; color: #ff9ad4;
            padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 0.82rem; text-align: center; display: none;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="card">
            <div class="header">
                <div class="logo">🎰</div>
                <div class="title">ROYAL CASINO CORE</div>
                <div class="subtitle">Crea tu cuenta y comienza a jugar</div>
            </div>

            <div id="errorMsg" class="error-message"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Nombre</label>
                        <input type="text" id="firstName" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Apellido</label>
                        <input type="text" id="lastName" placeholder="Tu apellido" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" placeholder="usuario123" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" placeholder="+57 300 000 0000" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Fecha de nacimiento</label>
                        <input type="date" id="dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Confirmar contraseña</label>
                    <input type="password" id="passwordConfirm" placeholder="Repite tu contraseña" minlength="8" required>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="terms" required>
                    <span>Acepto los <a href="#">términos y condiciones</a> y confirmo que soy mayor de edad.</span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">CREAR CUENTA</button>
            </form>

            <div class="link-row">¿Ya tienes cuenta? <a href="/login/">Inicia sesión aquí</a></div>
        </div>
    </div>

    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (password !== passwordConfirm) {
                errorMsg.textContent = 'Las contraseñas no coinciden';
                errorMsg.classList.add('show');
                return;
            }

            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                password_confirm: passwordConfirm,
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                date_of_birth: document.getElementById('dob').value
            };

            submitBtn.disabled = true;
            try {
                const token = document.querySelector('[name="csrfmiddlewaretoken"]')?.value || '';
                const response = await fetch('/api/users/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/login/';
                } else {
                    const firstError = Object.values(data)[0];
                    errorMsg.textContent = Array.isArray(firstError) ? firstError[0] : (data.error || 'Error al registrar');
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = 'Error de conexión';
                errorMsg.classList.add('show');
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
