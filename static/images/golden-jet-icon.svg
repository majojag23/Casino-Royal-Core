<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#741AC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44CFC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="64" cy="64" r="60" fill="url(#jetGrad)" opacity="0.2" stroke="url(#jetGrad)" stroke-width="2"/>
  <!-- Jet body -->
  <ellipse cx="64" cy="64" rx="12" ry="35" fill="#F44CFC" stroke="#741AC0" stroke-width="2"/>
  <!-- Jet wings -->
  <polygon points="64,50 35,60 40,70 64,60" fill="#741AC0"/>
  <polygon points="64,50 93,60 88,70 64,60" fill="#741AC0"/>
  <!-- Jet nose -->
  <polygon points="64,30 60,40 68,40" fill="#F44CFC"/>
  <!-- Trail lines -->
  <line x1="50" y1="85" x2="30" y2="100" stroke="#F44CFC" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="85" x2="64" y2="105" stroke="#F44CFC" stroke-width="2" opacity="0.6"/>
  <line x1="78" y1="85" x2="98" y2="100" stroke="#F44CFC" stroke-width="2" opacity="0.6"/>
</svg>