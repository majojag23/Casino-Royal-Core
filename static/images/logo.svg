<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#741AC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44CFC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.2"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad1)" stroke-width="2"/>

  <!-- Dados -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#741AC0" stroke="#F44CFC" stroke-width="2"/>
    <circle cx="10" cy="10" r="3" fill="#F44CFC"/>
    <circle cx="30" cy="10" r="3" fill="#F44CFC"/>
    <circle cx="20" cy="20" r="3" fill="#F44CFC"/>
    <circle cx="10" cy="30" r="3" fill="#F44CFC"/>
    <circle cx="30" cy="30" r="3" fill="#F44CFC"/>
  </g>

  <!-- Fichas -->
  <g transform="translate(90, 70)">
    <circle cx="0" cy="0" r="20" fill="#F44CFC" stroke="#741AC0" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#741AC0" stroke-width="1" opacity="0.5"/>
    <text x="0" y="8" text-anchor="middle" font-size="16" font-weight="bold" fill="#080254">$</text>
  </g>

  <!-- Texto -->
  <text x="100" y="155" text-anchor="middle" font-size="24" font-weight="bold" fill="#F44CFC">CASINO</text>
</svg>