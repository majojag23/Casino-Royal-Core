<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Royal Casino Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Tahoma, sans-serif;
            background: radial-gradient(circle at 20% 0%, #2B028C 0%, transparent 45%),
                        radial-gradient(circle at 100% 30%, #F44CFC 0%, transparent 35%),
                        #0E000E;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .screen { width: 100%; max-width: 420px; padding: 24px 18px; }
        .card { background: rgba(20, 5, 40, 0.55); border: 1px solid #46407C; border-radius: 24px; padding: 28px 22px; }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 2.4rem; }
        .title {
            font-size: 1.4rem; font-weight: 800; font-style: italic;
            background: linear-gradient(90deg, #FFD36E, #F44CFC);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: 0.8rem; color: #cfcbe8; margin-top: 6px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.72rem; color: #cfcbe8; margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid #46407C; border-radius: 10px;
            color: #fff; font-size: 0.9rem;
        }
        input::placeholder { color: #9c96c4; }
        input:focus { outline: none; border-color: #F44CFC; }

        .btn-submit {
            width: 100%; padding: 13px;
            border: 1px solid #B5FEFA; border-radius: 12px;
            background: conic-gradient(from 55deg, #01F9BE, #02F789, #00A8D4, #01F9BE);
            color: #052015; font-weight: 800; font-size: 1rem;
            cursor: pointer; margin-bottom: 14px;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .link-row { text-align: center; font-size: 0.82rem; color: #cfcbe8; }
        .link-row a { color: #F44CFC; text-decoration: none; font-weight: 600; }

        .error-message, .success-message {
            padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 0.82rem; text-align: center; display: none;
        }
        .error-message { background: rgba(244, 76, 252, 0.12); border: 1px solid #F44CFC; color: #ff9ad4; }
        .success-message { background: rgba(1, 249, 190, 0.1); border: 1px solid #01F9BE; color: #01F9BE; }
        .error-message.show, .success-message.show { display: block; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="card">
            <div class="header">
                <div class="logo">🔑</div>
                <div class="title">NUEVA CONTRASEÑA</div>
                <div class="subtitle">Ingresa tu nueva contraseña. Debe tener al menos 8 caracteres.</div>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="resetForm" onsubmit="handleReset(event)">
                {% csrf_token %}
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="passwordConfirm">Confirmar contraseña</label>
                    <input type="password" id="passwordConfirm" placeholder="Repite tu contraseña" minlength="8" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">ACTUALIZAR CONTRASEÑA</button>
            </form>

            <div class="link-row"><a href="/login/">Volver al login</a></div>
        </div>
    </div>

    <script>
        const resetToken = '{{ token }}';

        async function handleReset(event) {
            event.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const submitBtn = document.getElementById('submitBtn');
            errorMsg.classList.remove('show');

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (password !== passwordConfirm) {
                errorMsg.textContent = 'Las contraseñas no coinciden';
                errorMsg.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            try {
                const csrfToken = document.querySelector('[name="csrfmiddlewaretoken"]')?.value || '';
                const response = await fetch('/api/users/auth/reset_password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ token: resetToken, password: password, password_confirm: passwordConfirm })
                });
                const data = await response.json();

                if (response.ok) {
                    successMsg.textContent = 'Contraseña actualizada. Redirigiendo al login...';
                    successMsg.classList.add('show');
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => window.location.href = '/login/', 2000);
                } else {
                    errorMsg.textContent = data.error || 'Error al actualizar contraseña';
                    errorMsg.classList.add('show');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                errorMsg.textContent = 'Error de conexión';
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
