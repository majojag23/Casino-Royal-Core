<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Royal Casino Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Tahoma, sans-serif;
            background: radial-gradient(circle at 20% 0%, #2B028C 0%, transparent 45%),
                        radial-gradient(circle at 100% 30%, #F44CFC 0%, transparent 35%),
                        #0E000E;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .screen { width: 100%; max-width: 420px; padding: 24px 18px; }
        .card { background: rgba(20, 5, 40, 0.55); border: 1px solid #46407C; border-radius: 24px; padding: 28px 22px; }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 2.4rem; }
        .title {
            font-size: 1.4rem; font-weight: 800; font-style: italic;
            background: linear-gradient(90deg, #FFD36E, #F44CFC);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: 0.8rem; color: #cfcbe8; margin-top: 6px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.72rem; color: #cfcbe8; margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid #46407C; border-radius: 10px;
            color: #fff; font-size: 0.9rem;
        }
        input::placeholder { color: #9c96c4; }
        input:focus { outline: none; border-color: #F44CFC; }

        .btn-submit {
            width: 100%; padding: 13px;
            border: 1px solid #B5FEFA; border-radius: 12px;
            background: conic-gradient(from 55deg, #01F9BE, #02F789, #00A8D4, #01F9BE);
            color: #052015; font-weight: 800; font-size: 1rem;
            cursor: pointer; margin-bottom: 14px;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .link-row { text-align: center; font-size: 0.82rem; color: #cfcbe8; }
        .link-row a { color: #F44CFC; text-decoration: none; font-weight: 600; }

        .error-message, .success-message {
            padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 0.82rem; text-align: center; display: none;
        }
        .error-message { background: rgba(244, 76, 252, 0.12); border: 1px solid #F44CFC; color: #ff9ad4; }
        .success-message { background: rgba(1, 249, 190, 0.1); border: 1px solid #01F9BE; color: #01F9BE; }
        .error-message.show, .success-message.show { display: block; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="card">
            <div class="header">
                <div class="logo">🔐</div>
                <div class="title">RECUPERAR CONTRASEÑA</div>
                <div class="subtitle">Ingresa tu correo y te enviaremos instrucciones para recuperar tu cuenta.</div>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="forgotForm" onsubmit="handleForgot(event)">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">ENVIAR INSTRUCCIONES</button>
            </form>

            <div class="link-row">¿Ya recuerdas tu contraseña? <a href="/login/">Inicia sesión</a></div>
        </div>
    </div>

    <script>
        async function handleForgot(event) {
            event.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const submitBtn = document.getElementById('submitBtn');
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            const email = document.getElementById('email').value;
            submitBtn.disabled = true;

            try {
                const token = document.querySelector('[name="csrfmiddlewaretoken"]')?.value || '';
                const response = await fetch('/api/users/auth/forgot_password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (response.ok) {
                    successMsg.textContent = data.message || 'Si el email existe, se ha enviado un enlace de recuperación.';
                    successMsg.classList.add('show');
                    document.getElementById('forgotForm').reset();
                } else {
                    errorMsg.textContent = data.error || 'Error al enviar instrucciones';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = 'Error de conexión';
                errorMsg.classList.add('show');
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
